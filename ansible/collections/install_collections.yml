---
- name: Diagnose Ansible Collections Path
  hosts: localhost
  gather_facts: no
  connection: local

  tasks:
    - name: Show ANSIBLE_COLLECTIONS_PATH set by iagctl
      debug:
        msg: "ANSIBLE_COLLECTIONS_PATH = {{ lookup('env', 'ANSIBLE_COLLECTIONS_PATH') }}"

    - name: List collection directories at that path
      find:
        paths: "{{ lookup('env', 'ANSIBLE_COLLECTIONS_PATH') }}"
        file_type: directory
        recurse: no
      register: col_dirs
      when: lookup('env', 'ANSIBLE_COLLECTIONS_PATH') != ''

    - name: Print found collection directories
      debug:
        msg: "{{ col_dirs.files | map(attribute='path') | list }}"
      when: lookup('env', 'ANSIBLE_COLLECTIONS_PATH') != ''

    - name: Warn if ANSIBLE_COLLECTIONS_PATH is not set
      debug:
        msg: "WARNING: ANSIBLE_COLLECTIONS_PATH is not set - requirements.yml was likely not found"
      when: lookup('env', 'ANSIBLE_COLLECTIONS_PATH') == ''

    - name: Check if community.hashi_vault is in iagctl's hash dir
      ansible.builtin.stat:
        path: "{{ lookup('env', 'ANSIBLE_COLLECTIONS_PATH') }}/ansible_collections/community/hashi_vault"
      register: hashi_stat

    - name: Assert collection is present
      ansible.builtin.assert:
        that: hashi_stat.stat.exists
        success_msg: "community.hashi_vault found at {{ lookup('env', 'ANSIBLE_COLLECTIONS_PATH') }}"
        fail_msg: "community.hashi_vault NOT in hash dir — collections not installed correctly"

    - name: Get community.hashi_vault version
      ansible.builtin.command: >
        {{ lookup('env', 'ANSIBLE_COLLECTIONS_PATH') | dirname | dirname }}/bin/ansible-galaxy
        collection list community.hashi_vault
      register: hashi_version
      when: hashi_stat.stat.exists

    - name: Show version
      ansible.builtin.debug:
        msg: "{{ hashi_version.stdout_lines }}"
      when: hashi_stat.stat.exists